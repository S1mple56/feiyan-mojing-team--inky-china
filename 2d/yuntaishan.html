<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨神州 - 云台山</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: "KaiTi", "楷体", serif; }

        /* ===== 云台山背景 ===== */
        #bg {
            position: fixed; inset: 0; z-index: 0;
            background: url('province/henan/Architecture/location/bg_yuntaishan.png') center center / cover no-repeat;
        }
        #overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.5) 100%);
        }

        /* ===== 左上角 ===== */
        #top-left {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            display: flex; align-items: center; gap: 20px;
        }
        .btn-back {
            padding: 10px 20px; font-size: 20px; font-family: "KaiTi";
            background: rgba(0,0,0,0.6); color: #ceae75; border: 1px solid #ceae75;
            cursor: pointer; transition: 0.3s; border-radius: 8px;
        }
        .btn-back:hover { background: #ceae75; color: #000; }
        #page-title {
            font-size: 40px; color: #ffd700; text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            letter-spacing: 8px;
        }

        /* ===== 右上角 ===== */
        #top-right-ui {
            position: fixed; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 100;
        }
        .sys-btn {
            background: rgba(0,0,0,0.7); border: 2px solid #ceae75; color: #ceae75;
            padding: 10px 20px; font-size: 20px; font-family: "KaiTi"; border-radius: 8px;
            cursor: pointer; transition: 0.3s; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .sys-btn:hover { background: #ceae75; color: #000; }

        /* ===== 五个子景点 logo 卡片 ===== */
        #logo-grid {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; gap: 30px; z-index: 50;
        }
        .logo-card {
            width: 160px; cursor: pointer; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .logo-card:hover {
            transform: translateY(-12px) scale(1.08);
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.6));
        }
        .logo-card img {
            width: 150px; height: 150px; object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
            transition: filter 0.3s;
        }
        .logo-card:hover img {
            filter: drop-shadow(0 6px 20px rgba(255,215,0,0.5));
        }
        .logo-card .name {
            font-size: 22px; color: #f5f0e6; text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            letter-spacing: 3px; text-align: center;
        }

        /* ===== 底部诗句 ===== */
        #poem {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 50; text-align: center; color: rgba(206,174,117,0.8);
            font-size: 20px; letter-spacing: 6px; line-height: 2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>

<!-- 左上角 -->
<div id="top-left">
    <button class="btn-back" onclick="window.location.href='index.html'">← 返回神州</button>
    <span id="page-title">云台山</span>
</div>

<!-- 右上角 -->
<div id="top-right-ui">
    <button class="sys-btn" onclick="window.location.href='index.html?region=henan'">🗺️ 返回地图</button>
</div>

<!-- 五个子景点 logo -->
<div id="logo-grid">
    <div class="logo-card" onclick="enterScene('zhuyufeng')">
        <img src="province/henan/Architecture/logo/yuntaishan/zhuyufeng.png" alt="茱萸峰">
        <span class="name">茱萸峰</span>
    </div>
    <div class="logo-card" onclick="enterScene('hongshixia')">
        <img src="province/henan/Architecture/logo/yuntaishan/hongshixia.png" alt="红石峡">
        <span class="name">红石峡</span>
    </div>
    <div class="logo-card" onclick="enterScene('wanshansi')">
        <img src="province/henan/Architecture/logo/yuntaishan/wanshansi.png" alt="万善寺">
        <span class="name">万善寺</span>
    </div>
    <div class="logo-card" onclick="enterScene('zifanghu')">
        <img src="province/henan/Architecture/logo/yuntaishan/zifanghu.png" alt="子房湖">
        <span class="name">子房湖</span>
    </div>
    <div class="logo-card" onclick="enterScene('diecaidong')">
        <img src="province/henan/Architecture/logo/yuntaishan/diecaidong.png" alt="叠彩洞">
        <span class="name">叠彩洞</span>
    </div>
</div>

<!-- 底部诗句 -->
<div id="poem">
    独在异乡为异客 · 每逢佳节倍思亲<br>
    遥知兄弟登高处 · 遍插茱萸少一人
</div>

<script>
    function enterScene(name) {
        window.location.href = 'yuntaishan/' + name + '.html';
    }
</script>

    <script src="digital_human.js"></script>
</body>
</html>
