<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>古建游览 - 少林寺武宗禅影</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: "KaiTi", "楷体", serif; }
        #game-container { width: 100%; height: 100%; }
        #top-right-ui { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 100; }
        .sys-btn { background-color: rgba(0, 0, 0, 0.7); border: 2px solid #ceae75; color: #ceae75; padding: 10px 20px; font-size: 20px; font-family: "KaiTi"; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .sys-btn:hover { background-color: #ceae75; color: #000; }
        #ui-layer { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 800px; display: none; flex-direction: column; gap: 10px; pointer-events: none; z-index: 90; }
        .dialog-box { background-color: rgba(139, 69, 19, 0.95); border: 3px solid #ceae75; color: #fff; padding: 25px; font-size: 24px; border-radius: 8px; text-align: center; line-height: 1.6; text-shadow: 1px 1px 2px #000; }
        .options-container { display: none; flex-direction: column; gap: 10px; pointer-events: auto; }
        .option-btn { background-color: rgba(0, 0, 0, 0.8); border: 2px solid #ceae75; color: #ceae75; padding: 15px; font-size: 22px; border-radius: 5px; cursor: pointer; transition: 0.3s; text-align: left; font-family: "KaiTi"; }
        .option-btn:hover { background-color: #ceae75; color: #000; }
        .highlight { color: #ffd700; font-weight: bold; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(15, 15, 15, 0.95); border: 4px solid #ceae75; color: #fff; padding: 40px; border-radius: 12px; display: none; z-index: 200; text-align: center; min-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal h2 { margin-top: 0; color: #ffd700; font-size: 32px; border-bottom: 1px solid #ceae75; padding-bottom: 10px; }
        .close-btn { background-color: #ceae75; color: #000; border: none; padding: 10px 30px; font-size: 22px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: "KaiTi"; }
        .close-btn:hover { background-color: #fff; }
        .btn-group { margin-top: 30px; display: flex; justify-content: center; gap: 30px; }
        #toast { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(139, 69, 19, 0.9); border: 2px solid #ffd700; color: #fff; padding: 15px 30px; font-size: 24px; border-radius: 8px; display: none; z-index: 300; opacity: 0; transition: opacity 0.5s; text-align: center; }
    </style>
</head>
<body>

<div id="game-container"></div>

<div id="top-right-ui">
    <button class="sys-btn" onclick="toggleBackpack()">🎒 背包</button>
    <button class="sys-btn" onclick="togglePause()">⏸ 暂停</button>
</div>

<div id="ui-layer">
    <div id="dialog-text" class="dialog-box"></div>
    <div id="options-box" class="options-container">
        <button class="option-btn" onclick="answerQuestion(0)" id="opt-0"></button>
        <button class="option-btn" onclick="answerQuestion(1)" id="opt-1"></button>
        <button class="option-btn" onclick="answerQuestion(2)" id="opt-2"></button>
    </div>
</div>

<div id="backpack-modal" class="modal">
    <h2>行囊记录</h2>
    <div id="bp-list" style="font-size: 24px; line-height: 2; margin-bottom: 20px;"></div>
    <button class="close-btn" onclick="toggleBackpack()" style="margin-top: 10px;">关闭</button>
</div>

<div id="pause-modal" class="modal">
    <h2>游览已暂停</h2>
    <p style="font-size: 20px; color: #aaa;">少林清幽，宜静心打坐。</p>
    <div class="btn-group">
        <button class="close-btn" onclick="togglePause()">继续游览</button>
        <button class="close-btn" onclick="returnToMap()">返回地图</button>
    </div>
</div>

<div id="completion-modal" class="modal">
    <h2 style="color: #00ff00; font-size: 40px;">🎉 禅武合一 🎉</h2>
    <p style="font-size: 24px; line-height: 1.8;">
        您已成功收集少林寺的所有历史信物！<br>
        天下武功出少林。<br>
        感谢您见证这片中原佛国圣地。
    </p>
    <div class="btn-group">
        <button class="close-btn" onclick="restartJourney()">重新游历</button>
        <button class="close-btn" onclick="returnToMap()">返回地图</button>
    </div>
</div>

<div id="video-modal" class="modal" style="min-width: 800px; padding: 20px;">
    <h2 style="margin-bottom: 15px;">禅宗祖庭·少林武学</h2>
    <video id="story-video" width="100%" controls style="border: 2px solid #ceae75; border-radius: 8px; background: #000;">
        <source src="video/shaolinsi/1.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频播放。
    </video>
    <br>
    <button class="close-btn" onclick="closeVideo()" style="margin-top: 20px;">结束观看</button>
</div>

<div id="toast"></div>

<script>
let inventory = []; 
const totalItems = 5; 
let isPaused = false; 

const config = {
    type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, parent: 'game-container',
    physics: { default: 'arcade', arcade: { debug: false } },
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, cursors, wasd, spaceKey;
let npcs = []; let activeNPC = null; let dialogState = 'hidden'; 

const uiLayer = document.getElementById('ui-layer');
const dialogText = document.getElementById('dialog-text');
const optionsBox = document.getElementById('options-box');
const optBtns = [document.getElementById('opt-0'), document.getElementById('opt-1'), document.getElementById('opt-2')];

function preload() {
    // 资源路径指向河南少林寺
    this.load.image('bg', 'province/hubei/Architecture/location/bg_huanghelou.png'); 
    this.load.image('cuihao', 'province/hubei/Architecture/location/cuihao.png');
    this.load.image('sunquan', 'province/hubei/Architecture/location/sunquan.png');
    this.load.image('libai', 'province/hubei/Architecture/location/libai.png');
    this.load.image('menghaoran', 'province/hubei/Architecture/location/menghaoran.png');


    let playerSkin = localStorage.getItem('playerSkin') || 'player.png';
    if (playerSkin.startsWith('data:image')) {
        let arr = playerSkin.split(','); let mime = arr[0].match(/:(.*?);/)[1];
        let bstr = atob(arr[1]); let n = bstr.length; let u8arr = new Uint8Array(n);
        while (n--) { u8arr[n] = bstr.charCodeAt(n); }
        let blob = new Blob([u8arr], { type: mime });
        this.load.image('player', URL.createObjectURL(blob));
    } else {
        this.load.image('player', playerSkin);
    }
}

function create() {
    let bg = this.add.image(0, 0, 'bg').setOrigin(0, 0);
    let scaleX = this.cameras.main.width / bg.width;
    let scaleY = this.cameras.main.height / bg.height;
    let baseScale = Math.max(scaleX, scaleY) * 1.5; 
    bg.setScale(baseScale);

    let worldWidth = bg.width * baseScale; let worldHeight = bg.height * baseScale;
    this.physics.world.setBounds(0, 0, worldWidth, worldHeight);
    this.cameras.main.setBounds(0, 0, worldWidth, worldHeight);

    player = this.physics.add.sprite(worldWidth * 0.5, worldHeight * 0.5, 'player');
    let dynamicScale = 150 / player.height;
    player.setScale(dynamicScale); player.setCollideWorldBounds(true); player.body.setSize(player.width * 0.6, player.height * 0.6);

    // ================= 少林寺专属 NPC 数据 =================
    const npcConfigs = [
    // 1. 崔颢（核心主NPC，黄鹤楼千古第一诗作者，楼阁文化核心）
    { 
        id: 'cuihao', 
        name: '崔颢', 
        x: 0.5, 
        y: 0.5, 
        scale: 0.1, 
        tint: 0xffffff, 
        isMain: true, 
        item: '《黄鹤楼》诗卷真迹', 
        hasGivenItem: false, 
        intro: '<span class="highlight">【唐代诗人 崔颢】</span><br>黄鹤一去不复返，白云千载空悠悠！<br><br>▶ 按【空格键】观看《黄鹤楼》创作剧情视频' 
    },

    // 2. 孙权（黄鹤楼始建者，三国吴大帝，楼阁缘起）
    { 
        id: 'sunquan', 
        name: '孙权', 
        x: 0.3, 
        y: 0.7, 
        scale: 0.1, 
        tint: 0xffaaaa, 
        isMain: false, 
        item: '东吴楼橹兵符', 
        hasGivenItem: false, 
        intro: '<span class="highlight">【吴大帝 孙权】</span><br>我筑此楼于黄鹄矶头，以瞭望江汉，控御荆楚，成东吴江防要塞！<br><br>▶ 按【空格键】接受历史提问', 
        question: '我最初修建黄鹤楼，核心用途是什么？', 
        options: ['A. 宴饮赏景', 'B. 军事瞭望的江防楼橹', 'C. 祭祀江神'], 
        correct: 1, 
        success: '正是！此楼最初为军事所用，后世才成了文人墨客登临咏怀的千古名楼！', 
        fail: '错了！我筑此楼，是为了瞭望江汉军情，是东吴的江防要塞，并非为赏景而建。' 
    },

    // 3. 李白（唐代诗仙，黄鹤楼“搁笔亭”典故核心人物）
    { 
        id: 'libai', 
        name: '李白', 
        x: 0.75, 
        y: 0.4, 
        scale: 0.1, 
        tint: 0xaaffaa, 
        isMain: false, 
        item: '青莲居士酒壶', 
        hasGivenItem: false, 
        intro: '<span class="highlight">【唐代诗仙 李白】</span><br>眼前有景道不得，崔颢题诗在上头！<br><br>▶ 按【空格键】接受诗词提问', 
        question: '我在黄鹤楼送别友人，写下千古名句“故人西辞黄鹤楼”的下一句是？', 
        options: ['A. 烟花三月下扬州', 'B. 唯见长江天际流', 'C. 孤帆远影碧空尽'], 
        correct: 0, 
        success: '正是！在此送别孟夫子，望着长江烟波，才写下这送别名篇！', 
        fail: '非也！这句是《黄鹤楼送孟浩然之广陵》的首联，下一句正是“烟花三月下扬州”。' 
    },

    // 4. 孟浩然（唐代山水诗人，李白黄鹤楼送别的主角）
    { 
        id: 'menghaoran', 
        name: '孟浩然', 
        x: 0.7, 
        y: 0.6, 
        scale: 0.1, 
        tint: 0xaaaaff, 
        isMain: false, 
        item: '广陵行舟图', 
        hasGivenItem: false, 
        intro: '<span class="highlight">【唐代山水诗人 孟浩然】</span><br>在此与太白辞别，乘舟东下广陵，看尽长江万里烟波！<br><br>▶ 按【空格键】接受典故提问', 
        question: '李白在黄鹤楼送我东行，我此行的目的地是哪里？', 
        options: ['A. 苏州', 'B. 广陵（扬州）', 'C. 杭州'], 
        correct: 1, 
        success: '正是广陵！烟花三月，沿江东下，一路山水，皆是诗情！', 
        fail: '错了！太白诗中写得明白，“烟花三月下扬州”，扬州古称广陵。' 
    },

   
    
];
    // =======================================================

    npcConfigs.forEach(config => {
        let npcSprite = this.physics.add.sprite(worldWidth * config.x, worldHeight * config.y, config.id);
        npcSprite.setScale(config.scale); npcSprite.setImmovable(true); 
        npcSprite.body.setSize(npcSprite.width * 0.6, npcSprite.height * 0.6); npcSprite.npcData = config; 
        npcs.push(npcSprite); this.physics.add.collider(player, npcSprite);
    });

    cursors = this.input.keyboard.createCursorKeys();
    wasd = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68 });
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    this.cameras.main.startFollow(player, true, 0.08, 0.08); 
    this.input.on('wheel', (pointer, gameObjects, deltaX, deltaY, deltaZ) => {
        if(isPaused) return; 
        let newZoom = this.cameras.main.zoom - (deltaY * 0.001); 
        this.cameras.main.zoom = Phaser.Math.Clamp(newZoom, 1, 3); 
    });
}

function update() {
    if (isPaused) { player.setVelocity(0); return; }
    const speed = 250; 
    if (cursors.left.isDown || wasd.A.isDown) { player.setVelocityX(-speed); player.setFlipX(false); } 
    else if (cursors.right.isDown || wasd.D.isDown) { player.setVelocityX(speed); player.setFlipX(true); } 
    else { player.setVelocityX(0); }
    if (cursors.up.isDown || wasd.W.isDown) { player.setVelocityY(-speed); } 
    else if (cursors.down.isDown || wasd.S.isDown) { player.setVelocityY(speed); } 
    else { player.setVelocityY(0); }

    let closestNPC = null; let minDistance = 150; 
    npcs.forEach(npc => {
        let distance = Phaser.Math.Distance.Between(player.x, player.y, npc.x, npc.y);
        if (distance < minDistance) { minDistance = distance; closestNPC = npc; }
    });

    if (closestNPC) {
        if (activeNPC !== closestNPC) {
            activeNPC = closestNPC; dialogState = 'intro';
            uiLayer.style.display = 'flex'; optionsBox.style.display = 'none';
            dialogText.innerHTML = activeNPC.npcData.intro;
        }
        if (Phaser.Input.Keyboard.JustDown(spaceKey) && dialogState === 'intro') {
            if (activeNPC.npcData.isMain) { grantItem(activeNPC); playStoryVideo(); } 
            else {
                dialogState = 'question'; dialogText.innerHTML = `<span class="highlight">提问：</span><br>${activeNPC.npcData.question}`;
                optionsBox.style.display = 'flex'; 
                for(let i=0; i<3; i++) { optBtns[i].innerText = activeNPC.npcData.options[i]; }
            }
        }
    } else {
        activeNPC = null; dialogState = 'hidden'; uiLayer.style.display = 'none'; optionsBox.style.display = 'none';
    }
}

window.answerQuestion = function(selectedIndex) {
    if (!activeNPC || dialogState !== 'question') return;
    optionsBox.style.display = 'none'; dialogState = 'result'; 
    if (selectedIndex === activeNPC.npcData.correct) {
        let rewardHTML = "";
        if (!activeNPC.npcData.hasGivenItem) {
            grantItem(activeNPC); rewardHTML = `<br><br><span style="color:#ffd700">🎁 获得信物：【${activeNPC.npcData.item}】</span>`;
        } else { rewardHTML = `<br><br><span style="color:#aaa">（您已获得过该人物赠予的信物）</span>`; }
        dialogText.innerHTML = `<span style="color:#aaffaa;">【正确】</span><br>${activeNPC.npcData.success}${rewardHTML}`;
    } else {
        dialogText.innerHTML = `<span style="color:#ffaaaa;">【错误】</span><br>${activeNPC.npcData.fail}<br><br><span style="color:#ccc; font-size: 18px;">（走到远处再回来即可重新挑战）</span>`;
    }
}

function grantItem(npc) {
    if (!npc.npcData.hasGivenItem) {
        inventory.push(npc.npcData.item); npc.npcData.hasGivenItem = true;
        let _u = localStorage.getItem('ancient_username');
        if(_u) { try { let _p=JSON.stringify({username:_u, item_name:npc.npcData.item, item_desc:'黄鹤楼探寻获得的信物'}); if(navigator.sendBeacon) navigator.sendBeacon('http://127.0.0.1:5000/api/add-item', new Blob([_p],{type:'application/json'})); else fetch('http://127.0.0.1:5000/api/add-item',{method:'POST',headers:{'Content-Type':'application/json'},body:_p,keepalive:true}).catch(e=>console.error(e)); } catch(e){console.error(e);} }
        showToast(`🎉 获得文物：【${npc.npcData.item}】 🎉`);
        if (inventory.length === totalItems) {
            setTimeout(() => {
                document.getElementById('completion-modal').style.display = 'block'; isPaused = true;
            }, 2000); 
        }
    }
}

function playStoryVideo() {
    const videoModal = document.getElementById('video-modal'); const video = document.getElementById('story-video');
    videoModal.style.display = 'block'; video.currentTime = 0;
    let p = video.play(); if (p !== undefined) p.catch(e => console.warn('视频播放失败:', e));
    isPaused = true;
}
window.closeVideo = function() {
    const videoModal = document.getElementById('video-modal'); const video = document.getElementById('story-video');
    try { video.pause(); } catch(e) {}
    videoModal.style.display = 'none'; isPaused = false;
}
function showToast(msg) {
    const toast = document.getElementById('toast'); toast.innerHTML = msg; toast.style.display = 'block'; toast.style.opacity = 1;
    setTimeout(() => { toast.style.opacity = 0; setTimeout(() => toast.style.display = 'none', 500); }, 2500);
}
window.togglePause = function() {
    if(document.getElementById('backpack-modal').style.display === 'block' || document.getElementById('completion-modal').style.display === 'block') return;
    isPaused = !isPaused; document.getElementById('pause-modal').style.display = isPaused ? 'block' : 'none';
}
window.toggleBackpack = function() {
    if(document.getElementById('pause-modal').style.display === 'block' || document.getElementById('completion-modal').style.display === 'block') return;
    let bp = document.getElementById('backpack-modal');
    if (bp.style.display === 'block') { bp.style.display = 'none'; isPaused = false; } 
    else {
        isPaused = true;  
        let listHtml = inventory.length > 0 ? inventory.map(item => `<div style="color:#ffd700; margin:10px 0;">📜 ${item}</div>`).join('') : '<div style="color:#aaa; margin: 20px 0;">行囊空空如也，去与名士结交吧！</div>';
        document.getElementById('bp-list').innerHTML = `${listHtml}<div style="color:#aaa; font-size:18px; margin-top:30px; border-top: 1px solid #555; padding-top: 10px;">收集进度：${inventory.length} / ${totalItems}</div>`;
        bp.style.display = 'block';
    }
}
window.restartJourney = function() {
    inventory = []; npcs.forEach(npc => { npc.npcData.hasGivenItem = false; });
    document.getElementById('completion-modal').style.display = 'none'; isPaused = false; showToast("时光回溯，新的游历开始了...");
}
window.returnToMap = function() {
    // 【核心返回路径】完成游览后返回湖北
    window.location.href = 'index.html?region=hubei';
}
</script>
    <script src="digital_human.js"></script>
</body>
</html>
