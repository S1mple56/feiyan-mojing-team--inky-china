<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>场景探索 - 茱萸峰</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: "KaiTi", "楷体", serif; }
        #game-container { width: 100%; height: 100%; }
        #top-right-ui { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 100; }
        .sys-btn { background-color: rgba(0, 0, 0, 0.7); border: 2px solid #ceae75; color: #ceae75; padding: 10px 20px; font-size: 20px; font-family: "KaiTi"; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .sys-btn:hover { background-color: #ceae75; color: #000; }
        #ui-layer { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 800px; display: none; flex-direction: column; gap: 10px; pointer-events: none; z-index: 90; }
        .dialog-box { background-color: rgba(139, 69, 19, 0.95); border: 3px solid #ceae75; color: #fff; padding: 25px; font-size: 24px; border-radius: 8px; text-align: center; line-height: 1.6; text-shadow: 1px 1px 2px #000; }
        .options-container { display: none; flex-direction: column; gap: 10px; pointer-events: auto; }
        .option-btn { background-color: rgba(0, 0, 0, 0.8); border: 2px solid #ceae75; color: #ceae75; padding: 15px; font-size: 22px; border-radius: 5px; cursor: pointer; transition: 0.3s; text-align: left; font-family: "KaiTi"; }
        .option-btn:hover { background-color: #ceae75; color: #000; }
        .highlight { color: #ffd700; font-weight: bold; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(15, 15, 15, 0.95); border: 4px solid #ceae75; color: #fff; padding: 40px; border-radius: 12px; display: none; z-index: 200; text-align: center; min-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal h2 { margin-top: 0; color: #ffd700; font-size: 32px; border-bottom: 1px solid #ceae75; padding-bottom: 10px; }
        .close-btn { background-color: #ceae75; color: #000; border: none; padding: 10px 30px; font-size: 22px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: "KaiTi"; margin-top: 20px; }
        .close-btn:hover { background-color: #fff; }
        .btn-group { margin-top: 30px; display: flex; justify-content: center; gap: 30px; }
        #toast { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(139, 69, 19, 0.9); border: 2px solid #ffd700; color: #fff; padding: 15px 30px; font-size: 24px; border-radius: 8px; display: none; z-index: 300; text-align: center; }
    </style>
</head>
<body>
<div id="game-container"></div>
<div id="top-right-ui">
    <button class="sys-btn" onclick="window.location.href='zhuyufeng.html'">← 返回茱萸峰</button>
    <button class="sys-btn" onclick="toggleBackpack()">🎒 背包</button>
    <button class="sys-btn" onclick="togglePause()">⏸ 暂停</button>
</div>
<div id="ui-layer">
    <div id="dialog-text" class="dialog-box"></div>
    <div id="options-box" class="options-container">
        <button class="option-btn" onclick="answerQuestion(0)" id="opt-0"></button>
        <button class="option-btn" onclick="answerQuestion(1)" id="opt-1"></button>
        <button class="option-btn" onclick="answerQuestion(2)" id="opt-2"></button>
    </div>
</div>
<div id="backpack-modal" class="modal">
    <h2>行囊记录</h2>
    <div id="bp-list" style="font-size: 24px; line-height: 2; margin-bottom: 20px;"></div>
    <button class="close-btn" onclick="toggleBackpack()">关闭</button>
</div>
<div id="pause-modal" class="modal">
    <h2>游览已暂停</h2>
    <div class="btn-group">
        <button class="close-btn" onclick="togglePause()">继续游览</button>
        <button class="close-btn" onclick="returnToMap()">返回云台山</button>
    </div>
</div>
<div id="completion-modal" class="modal">
    <h2 style="color: #00ff00; font-size: 36px;">🎉 登顶成功 🎉</h2>
    <p style="font-size: 22px; line-height: 1.8;">您已登临茱萸峰顶，俯瞰太行群峰。<br><span style="color:#ffd700;">🎁 获得信物：茱萸红叶</span></p>
    <div class="btn-group">
        <button class="close-btn" onclick="returnToMap()">返回云台山</button>
    </div>
</div>
<div id="toast"></div>
<script>
let inventory = [];
const totalItems = 3;
let isPaused = false;
const config = {
    type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, parent: 'game-container',
    physics: { default: 'arcade', arcade: { debug: false } },
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { preload: preload, create: create, update: update }
};
const game = new Phaser.Game(config);
let player, cursors, wasd, spaceKey, npcs = [], activeNPC = null, dialogState = 'hidden';
const uiLayer = document.getElementById('ui-layer'), dialogText = document.getElementById('dialog-text'), optionsBox = document.getElementById('options-box');
const optBtns = [document.getElementById('opt-0'), document.getElementById('opt-1'), document.getElementById('opt-2')];

function preload() {
    this.load.image('bg', '../province/henan/Architecture/location/yuntaishan/bg_zhuyufeng.png');
    this.load.image('baijuyi', '../province/henan/Architecture/location/baijuyi.png');
    this.load.image('direnjie', '../province/henan/Architecture/location/direnjie.png');
    this.load.image('crafter', '../province/henan/Architecture/location/crafter.png');
    // 加载玩家角色（与少林寺相同逻辑）
    let playerSkin = localStorage.getItem('playerSkin') || 'player.png';
    if (playerSkin.startsWith('data:image')) {
        let arr = playerSkin.split(','), mime = arr[0].match(/:(.*?);/)[1];
        let bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        this.load.image('player', URL.createObjectURL(new Blob([u8arr], { type: mime })));
    } else {
        this.load.image('player', '../' + playerSkin);
    }
}

function create() {
    let bg = this.add.image(0, 0, 'bg').setOrigin(0, 0);
    let bs = Math.max(this.cameras.main.width / bg.width, this.cameras.main.height / bg.height) * 1.5;
    bg.setScale(bs);
    let W = bg.width * bs, H = bg.height * bs;
    this.physics.world.setBounds(0, 0, W, H); this.cameras.main.setBounds(0, 0, W, H);
    player = this.physics.add.sprite(W * 0.5, H * 0.7, 'player');
    player.setScale(150 / player.height); player.setCollideWorldBounds(true); player.body.setSize(player.width * 0.6, player.height * 0.6);
    const nc = [
        { id: 'baijuyi', name: '诗人 白居易', x: 0.45, y: 0.55, scale: 0.2, item: '《九月九日忆山东兄弟》手稿', hasGivenItem: false, intro: '<span class="highlight">【白居易】</span><br>独在异乡为异客，每逢佳节倍思亲。此乃王维登茱萸峰所作。<br><br>▶ 按【空格键】与诗人对话', question: '王维在茱萸峰写下此诗时，正值哪个节日？', options: ['A. 中秋节', 'B. 重阳节', 'C. 春节'], correct: 1, success: '善哉！九月九日重阳佳节，登高望远，遍插茱萸。', fail: '非也，此诗作于重阳佳节。' },
        { id: 'direnjie', name: '狄仁杰', x: 0.5, y: 0.3, scale: 0.2, item: '真武护身符', hasGivenItem: false, intro: '<span class="highlight">【狄仁杰】</span><br>峰顶有真武大帝庙，始建于唐代，香火绵延千年。<br><br>▶ 按【空格键】接受问道', question: '茱萸峰海拔多少米？', options: ['A. 1008米', 'B. 1208米', 'C. 1308米'], correct: 2, success: '不错！茱萸峰海拔1308米，是云台山主峰。', fail: '茱萸峰海拔1308米。' },
        { id: 'crafter', name: '采药老人', x: 0.65, y: 0.7, scale: 0.4, item: '茱萸果', hasGivenItem: false, intro: '<span class="highlight">【采药老人】</span><br>茱萸遍山，红果累累，可入药驱寒。重阳佩戴以辟邪。<br><br>▶ 按【空格键】了解茱萸', question: '茱萸在传统中医中主要功效是什么？', options: ['A. 清热解毒', 'B. 温中散寒', 'C. 滋阴补肾'], correct: 1, success: '正是！茱萸性温，能温中散寒，古人重阳佩戴以辟邪。', fail: '茱萸性温，主要功效是温中散寒。' }
    ];
    nc.forEach(c => {
        let n = this.physics.add.sprite(W * c.x, H * c.y, c.id); n.setScale(c.scale); n.setImmovable(true); n.body.setSize(n.width * 0.6, n.height * 0.6); n.npcData = c; npcs.push(n); this.physics.add.collider(player, n);
    });
    cursors = this.input.keyboard.createCursorKeys(); wasd = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68 }); spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE); this.cameras.main.startFollow(player, true, 0.08, 0.08);
}

function update() {
    if (isPaused) { player.setVelocity(0); return; } const s = 250;
    if (cursors.left.isDown || wasd.A.isDown) { player.setVelocityX(-s); player.setFlipX(false); } else if (cursors.right.isDown || wasd.D.isDown) { player.setVelocityX(s); player.setFlipX(true); } else { player.setVelocityX(0); }
    if (cursors.up.isDown || wasd.W.isDown) { player.setVelocityY(-s); } else if (cursors.down.isDown || wasd.S.isDown) { player.setVelocityY(s); } else { player.setVelocityY(0); }
    let cl = null, md = 150; npcs.forEach(n => { let d = Phaser.Math.Distance.Between(player.x, player.y, n.x, n.y); if (d < md) { md = d; cl = n; } });
    if (cl) {
        if (activeNPC !== cl) { activeNPC = cl; dialogState = 'intro'; uiLayer.style.display = 'flex'; optionsBox.style.display = 'none'; dialogText.innerHTML = activeNPC.npcData.intro; }
        if (Phaser.Input.Keyboard.JustDown(spaceKey) && dialogState === 'intro') { dialogState = 'question'; dialogText.innerHTML = `<span class="highlight">提问：</span><br>${activeNPC.npcData.question}`; optionsBox.style.display = 'flex'; for (let i = 0; i < 3; i++) optBtns[i].innerText = activeNPC.npcData.options[i]; }
    } else { activeNPC = null; dialogState = 'hidden'; uiLayer.style.display = 'none'; optionsBox.style.display = 'none'; }
}

window.answerQuestion = function(i) {
    if (!activeNPC || dialogState !== 'question') return; optionsBox.style.display = 'none'; dialogState = 'result';
    if (i === activeNPC.npcData.correct) {
        if (!activeNPC.npcData.hasGivenItem) { activeNPC.npcData.hasGivenItem = true; inventory.push(activeNPC.npcData.item); showToast(`🎁 获得信物：【${activeNPC.npcData.item}】`); }
        dialogText.innerHTML = `<span style="color:#aaffaa;">【正确】</span><br>${activeNPC.npcData.success}`;
        if (inventory.length >= totalItems) setTimeout(() => { document.getElementById('completion-modal').style.display = 'block'; isPaused = true; }, 2000);
    } else { dialogText.innerHTML = `<span style="color:#ffaaaa;">【错误】</span><br>${activeNPC.npcData.fail}<br><br><span style="color:#ccc; font-size: 18px;">（走到远处再回来即可重新挑战）</span>`; }
};

function showToast(m) { let t = document.getElementById('toast'); t.innerHTML = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
window.togglePause = function() { if (document.getElementById('backpack-modal').style.display === 'block') return; isPaused = !isPaused; document.getElementById('pause-modal').style.display = isPaused ? 'block' : 'none'; };
window.toggleBackpack = function() {
    let bp = document.getElementById('backpack-modal');
    if (bp.style.display === 'block') { bp.style.display = 'none'; isPaused = false; }
    else { isPaused = true; let list = inventory.length > 0 ? inventory.map(item => `<div style="color:#ffd700; margin:10px 0;">📜 ${item}</div>`).join('') : '<div style="color:#aaa; margin: 20px 0;">行囊空空如也</div>'; document.getElementById('bp-list').innerHTML = `${list}<div style="color:#aaa; font-size:18px; margin-top:30px; border-top: 1px solid #555; padding-top: 10px;">收集进度：${inventory.length} / ${totalItems}</div>`; bp.style.display = 'block'; }
};
window.returnToMap = function() { window.location.href = '../yuntaishan.html'; };
</script>
</body>
</html>
