<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万善寺 · 古建搭建</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{overflow:hidden;background:#111;font-family:"KaiTi","楷体",serif}
        #loading{position:fixed;inset:0;z-index:200;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
        #loading.hide{opacity:0;pointer-events:none}
        #loading h1{font-size:48px;color:#ffd700;letter-spacing:8px;margin-bottom:10px}
        #loading .sub{font-size:18px;color:#ceae75;margin-bottom:25px}
        #loading .bar{width:300px;height:4px;background:#333;border-radius:2px;overflow:hidden}
        #loading .bar-fill{height:100%;width:0%;background:#ffd700;transition:width 0.3s}
        #loading .status{margin-top:15px;font-size:14px;color:#888}
        #top-left{position:fixed;top:20px;left:20px;z-index:100;display:flex;align-items:center;gap:20px}
        .btn-back{padding:10px 20px;font-size:20px;font-family:"KaiTi";background:rgba(0,0,0,0.6);color:#ceae75;border:1px solid #ceae75;cursor:pointer;transition:0.3s;border-radius:8px}
        .btn-back:hover{background:#ceae75;color:#000}
        #page-title{font-size:32px;color:#ffd700;text-shadow:2px 2px 8px rgba(0,0,0,0.8);letter-spacing:6px}
        #layer-panel{position:fixed;top:80px;right:20px;z-index:100;background:rgba(0,0,0,0.8);border:1px solid #555;border-radius:14px;padding:18px;width:220px}
        #layer-panel h3{font-size:20px;color:#ffd700;letter-spacing:3px;margin-bottom:12px;text-align:center;border-bottom:1px solid #444;padding-bottom:8px}
        .layer-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:6px;background:rgba(255,255,255,0.04);border:1px solid #333;border-radius:8px;color:#aaa;font-size:14px;font-family:"KaiTi";cursor:pointer;transition:all 0.2s}
        .layer-btn:hover{background:rgba(255,215,0,0.1);border-color:#ffd700;color:#ffd700}
        .layer-btn.active{background:rgba(255,215,0,0.15);border-color:#ffd700;color:#ffd700}
        .layer-btn .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#333;border-radius:50%;font-size:13px;color:#aaa;flex-shrink:0}
        .layer-btn.active .num{background:rgba(255,215,0,0.3);color:#ffd700}
        .layer-btn .name{flex:1;text-align:left}
        #bottom-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:15px}
        .action-btn{background:rgba(0,0,0,0.7);border:2px solid #ceae75;color:#ceae75;padding:12px 28px;font-size:20px;font-family:"KaiTi";border-radius:10px;cursor:pointer;transition:0.3s}
        .action-btn:hover{background:#ceae75;color:#000}
        .action-btn.primary{background:linear-gradient(135deg,#ffd700,#b8860b);color:#111;border-color:#ffd700;font-weight:bold}
        .action-btn.primary:hover{transform:scale(1.05)}
        #info-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(0,0,0,0.85);border:1px solid #555;border-radius:10px;padding:12px 24px;color:#ffd700;font-size:16px;display:none;text-align:center}
        #complete-modal{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center}
        #complete-modal.show{display:flex}
        #complete-modal h2{font-size:48px;color:#ffd700;letter-spacing:6px;margin-bottom:15px}
        #complete-modal .desc{font-size:22px;color:#ceae75;margin-bottom:30px;text-align:center;line-height:1.8}
        #complete-modal .btns{display:flex;gap:20px}
        #controls-hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;color:#555;font-size:12px;pointer-events:none}
    </style>
</head>
<body>

<div id="loading">
    <h1>万善寺</h1>
    <div class="sub">古建搭建 · 水墨神州</div>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
    <div class="status" id="load-status">准备加载...</div>
</div>

<div id="top-left">
    <button class="btn-back" onclick="window.location.href='../yuntaishan.html'">← 返回云台山</button>
    <span id="page-title">万善寺 · 古建搭建</span>
</div>
<div id="layer-panel"><h3>建筑层级</h3><div id="layer-list"></div></div>
<div id="bottom-bar">
    <button class="action-btn" onclick="resetAll()">重置</button>
    <button class="action-btn" onclick="toggleRotate()">自动旋转</button>
    <button class="action-btn primary" onclick="addLayer()">逐层搭建</button>
</div>
<div id="info-toast"></div>
<div id="complete-modal">
    <h2>搭建完成！</h2>
    <div class="desc">万善寺大殿已落成。<br>台基稳固、梁架挺拔、斗拱层叠、屋脊高耸。</div>
    <div class="btns">
        <button class="action-btn" onclick="resetAll()">再次搭建</button>
        <button class="action-btn" onclick="window.location.href='../yuntaishan.html'">返回云台山</button>
    </div>
</div>
<div id="controls-hint">鼠标左键拖动旋转 · 滚轮缩放</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
var LAYERS = [
    {id:9, name:'台基层'},
    {id:8, name:'柱网层'},
    {id:7, name:'门窗及围护层'},
    {id:6, name:'斗拱层'},
    {id:5, name:'檐口与天花层'},
    {id:4, name:'木构梁架层'},
    {id:3, name:'椽子层'},
    {id:2, name:'望板基层'},
    {id:1, name:'屋面瓦作层'},
    {id:0, name:'屋脊及脊饰层'}
];

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

var camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(15, 12, 15);
camera.lookAt(0, 3, 0);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
var dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(15, 25, 15);
scene.add(dl);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3, 0);

scene.add(new THREE.GridHelper(30, 30, 0x444444, 0x333333));

var curLayer = -1;
var models = [];
var yOff = 0;
var rot = false;

// 初始化 UI
LAYERS.forEach(function(l, i) {
    var btn = document.createElement('div');
    btn.className = 'layer-btn';
    btn.id = 'lb' + i;
    btn.innerHTML = '<span class="num">' + (i+1) + '</span><span class="name">' + l.name + '</span>';
    btn.onclick = function() { jumpTo(i); };
    document.getElementById('layer-list').appendChild(btn);
});

function updUI() {
    LAYERS.forEach(function(_, i) {
        document.getElementById('lb'+i).classList.toggle('active', i <= curLayer);
    });
}

function toast(m, d) {
    d = d || 2500;
    var e = document.getElementById('info-toast');
    e.textContent = m; e.style.display = 'block';
    clearTimeout(e._t);
    e._t = setTimeout(function() { e.style.display = 'none'; }, d);
}

// 加载单个 GLB 模型
function loadGLB(id) {
    return new Promise(function(resolve, reject) {
        var loader = new THREE.GLTFLoader();
        loader.load('../F_glb/' + id + '.glb', function(gltf) {
            resolve(gltf);
        }, undefined, function(error) {
            reject(error);
        });
    });
}

// 构建 Three.js Group（从 GLB 场景）
function buildGroup(gltf, y) {
    var group = new THREE.Group();
    gltf.scene.traverse(function(child) {
        if (child.isMesh) {
            child.position.y = y || 0;
            group.add(child);
        }
    });
    return group;
}

// 加载所有模型
function init() {
    var loaded = 0;
    LAYERS.forEach(function(l, i) {
        document.getElementById('load-status').textContent = '加载 ' + l.name + '...';
        document.getElementById('load-bar').style.width = (i/LAYERS.length*100) + '%';

        loadGLB(l.id).then(function(gltf) {
            models[i] = gltf;
            loaded++;
            console.log('[OK]', l.name);
            if (loaded === LAYERS.length) {
                document.getElementById('load-status').textContent = '加载完成！';
                document.getElementById('load-bar').style.width = '100%';
                setTimeout(function() {
                    document.getElementById('loading').classList.add('hide');
                    toast('点击"逐层搭建"开始建造万善寺', 4000);
                }, 500);
            }
        }).catch(function(e) {
            console.error('[ERR]', l.name, e);
            models[i] = null;
            loaded++;
        });
    });
}

// 逐层搭建
function addLayer() {
    if (curLayer >= LAYERS.length - 1) { toast('已搭建完成！'); return; }
    curLayer++;

    var gltf = models[curLayer];
    if (!gltf) { toast('第' + (curLayer+1) + '层数据缺失'); return; }

    var group = buildGroup(gltf, yOff);
    scene.add(group);

    // 计算高度增量
    var box = new THREE.Box3().setFromObject(group);
    var h = box.max.y - box.min.y;
    yOff += h + 0.1;

    // 调整相机目标
    controls.target.set(0, yOff / 2, 0);

    updUI();
    toast('第' + (curLayer+1) + '层：' + LAYERS[curLayer].name);

    if (curLayer >= LAYERS.length - 1) {
        setTimeout(function() { document.getElementById('complete-modal').classList.add('show'); }, 800);
    }
}

function jumpTo(i) { while (curLayer < i) addLayer(); }

function resetAll() {
    // 移除所有 mesh（保留灯光和网格）
    var toRemove = [];
    scene.traverse(function(c) { if (c.isMesh && c.geometry.type !== 'GridHelper' && c.geometry.type !== 'PlaneGeometry' && c.geometry.type !== 'CircleGeometry') toRemove.push(c); });
    toRemove.forEach(function(m) { scene.remove(m); });
    // 重新添加网格
    scene.add(new THREE.GridHelper(30, 30, 0x444444, 0x333333));
    curLayer = -1; yOff = 0;
    updUI();
    document.getElementById('complete-modal').classList.remove('show');
    toast('已重置');
}

function toggleRotate() {
    rot = !rot;
    controls.autoRotate = rot;
    controls.autoRotateSpeed = 2;
    toast(rot ? '自动旋转：开' : '自动旋转：关');
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
init();
</script>
</body>
</html>
