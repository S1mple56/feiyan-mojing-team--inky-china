<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>模型测试</title></head>
<body style="margin:0;overflow:hidden;background:#111">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(10, 8, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(10, 20, 10);
scene.add(dl);

// 加载 JSON 模型
fetch('../F_json/9.json')
    .then(r => r.json())
    .then(data => {
        console.log('顶点数:', data.v.length/3, '面数:', data.f.length);

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(data.v, 3));
        geo.setIndex(data.f.flat());
        geo.computeVertexNormals();

        const mat = new THREE.MeshLambertMaterial({
            color: 0xcc8844,
            side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geo, mat);

        // 自动计算包围盒并调整相机
        geo.computeBoundingBox();
        const box = geo.boundingBox;
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        console.log('中心:', center, '尺寸:', size, '最大维度:', maxDim);

        mesh.position.sub(center);
        camera.position.set(maxDim*1.5, maxDim*1.2, maxDim*1.5);
        camera.lookAt(0, 0, 0);

        scene.add(mesh);
        console.log('模型已添加到场景');
    })
    .catch(e => console.error('加载失败:', e));

// 辅助网格
const grid = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
scene.add(grid);

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
