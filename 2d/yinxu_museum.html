<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>古建游览 - 殷墟博物馆新馆(鼎形宝库)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050d14; font-family: "KaiTi", "楷体", serif; }
        #game-container { width: 100%; height: 100%; }
        .sys-btn { position: absolute; top: 20px; right: 20px; z-index: 100; background-color: rgba(0, 0, 0, 0.7); border: 2px solid #00ffcc; color: #00ffcc; padding: 10px 20px; font-size: 20px; font-family: "KaiTi"; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .sys-btn:hover { background-color: #00ffcc; color: #000; }
        .sys-btn-left { position: absolute; top: 20px; left: 20px; z-index: 100; background-color: rgba(0, 0, 0, 0.7); border: 2px solid #ceae75; color: #ceae75; padding: 10px 20px; font-size: 20px; font-family: "KaiTi"; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .sys-btn-left:hover { background-color: #ceae75; color: #000; }
        
        #ui-layer { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 800px; display: none; flex-direction: column; gap: 10px; pointer-events: none; z-index: 90; }
        .dialog-box { background-color: rgba(10, 25, 40, 0.95); border: 3px solid #00ffcc; color: #fff; padding: 25px; font-size: 24px; border-radius: 8px; text-align: center; line-height: 1.6; text-shadow: 1px 1px 2px #000; }
        .options-container { display: none; flex-direction: column; gap: 10px; pointer-events: auto; }
        .option-btn { background-color: rgba(0, 0, 0, 0.8); border: 2px solid #00ffcc; color: #00ffcc; padding: 15px; font-size: 22px; border-radius: 5px; cursor: pointer; transition: 0.3s; text-align: left; font-family: "KaiTi"; }
        .option-btn:hover { background-color: #00ffcc; color: #000; }
        .highlight { color: #ffd700; font-weight: bold; }
        #toast { position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.9); border: 2px solid #00ffcc; color: #00ffcc; padding: 15px 30px; font-size: 24px; border-radius: 8px; display: none; z-index: 300; opacity: 0; transition: opacity 0.5s; text-align: center; }
    </style>
</head>
<body>

<button class="sys-btn-left" onclick="window.location.href='yinxu.html'">🔙 返回宫殿宗庙遗址</button>

<div id="game-container"></div>

<div id="ui-layer">
    <div id="dialog-text" class="dialog-box"></div>
    <div id="options-box" class="options-container">
        <button class="option-btn" onclick="dialogState='hidden'; document.getElementById('ui-layer').style.display='none';">【关闭】</button>
    </div>
</div>

<div id="toast"></div>

<script>
function showToast(msg) {
    const toast = document.getElementById('toast'); toast.innerHTML = msg; toast.style.display = 'block'; toast.style.opacity = 1;
    setTimeout(() => { toast.style.opacity = 0; setTimeout(() => toast.style.display = 'none', 500); }, 3500);
}

const config = {
    type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, parent: 'game-container',
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, cursors, wasd, spaceKey, activeLM = null;
let dialogState = 'hidden';
let lZones = [];

function preload() {
    this.load.image('bg_museum', 'province/henan/Architecture/location/bg_yinxu.png'); 
    let playerSkin = localStorage.getItem('playerSkin') || 'player.png';
    if (playerSkin.startsWith('data:image')) {
        let arr = playerSkin.split(','); let bstr = atob(arr[1]); let n = bstr.length; let u8arr = new Uint8Array(n);
        while (n--) { u8arr[n] = bstr.charCodeAt(n); }
        this.load.image('player', URL.createObjectURL(new Blob([u8arr], { type: arr[0].match(/:(.*?);/)[1] })));
    } else { this.load.image('player', playerSkin); }
}

function create() {
    let bg = this.add.image(0, 0, 'bg_museum').setOrigin(0, 0).setTint(0x55aaaa); // 偏现代科技蓝绿
    let scaleX = this.cameras.main.width / bg.width; let scaleY = this.cameras.main.height / bg.height;
    let baseScale = Math.max(scaleX, scaleY) * 1.5; bg.setScale(baseScale);

    let ww = bg.width * baseScale; let wh = bg.height * baseScale;
    this.physics.world.setBounds(0, 0, ww, wh); this.cameras.main.setBounds(0, 0, ww, wh);

    player = this.physics.add.sprite(ww * 0.5, wh * 0.8, 'player').setScale(150 / this.textures.get('player').getSourceImage().height);
    player.setCollideWorldBounds(true); player.body.setSize(player.width * 0.6, player.height * 0.6);

    const halls = [
        { name: '🏛️ “探索商文明”展厅', x: 0.2, y: 0.3, desc: '展出殷墟考古发掘史。1928年，董作宾挥出殷墟考古的第一铲，从此拉开了中国现代考古学的序幕。' },
        { name: '✨ “伟大的商文明”展陈', x: 0.5, y: 0.3, desc: '近4000件文物悉数登场，其中国宝“司母辛四足觥”、“亚长牛尊”熠熠生辉。' },
        { name: '🐢 “子何人哉”甲骨特展', x: 0.8, y: 0.3, desc: '探秘花园庄东地甲骨。还原那位谜一般的商代高阶贵族“子”的生活与信仰。' },
        { name: '💀 “长从何来”亚长墓专题', x: 0.3, y: 0.6, desc: '亚长是殷商时期赫赫有名的武将，馆内通过骸骨创伤复原了他在战场上的最后防线。' },
        { name: '🐎 车马遗迹专题展厅', x: 0.7, y: 0.6, desc: '真实复刻多辆商代御用车马实物，震撼展示了殷商战车的机械结构。' }
    ];

    halls.forEach(hall => {
        let zone = this.add.zone(ww * hall.x, wh * hall.y).setSize(200, 200);
        this.physics.world.enable(zone); zone.body.setAllowGravity(false); zone.body.moves = false;
        
        let p = this.add.rectangle(ww * hall.x, wh * hall.y - 100, 350, 50, 0x0a1928, 0.8).setStrokeStyle(2, 0x00ffcc);
        let txt = this.add.text(ww * hall.x, wh * hall.y - 100, hall.name, { font: '24px KaiTi', fill: '#00ffcc', fontStyle: 'bold' }).setOrigin(0.5);
        this.tweens.add({ targets: [p, txt], y: '-=15', duration: 2000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        
        zone.lmData = hall; lZones.push(zone);
    });

    // 巨大的返程水墨阵
    let rZ = this.add.zone(ww * 0.5, wh * 0.05).setSize(ww, 150);
    this.physics.world.enable(rZ); rZ.body.setAllowGravity(false); rZ.body.moves = false;
    this.add.text(ww * 0.5, wh * 0.08, '⛩️ 传送阵（往北：返回宫殿宗庙区）', { font: '30px KaiTi', fill: '#ffd700', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
    
    window.transitioning = false;
    window.nearReturnPortal = false;
    this.physics.add.overlap(player, rZ, () => {
        window.nearReturnPortal = true;
    });

    cursors = this.input.keyboard.createCursorKeys();
    wasd = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68 });
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.cameras.main.startFollow(player, true, 0.08, 0.08); 
    this.input.on('wheel', (p, o, dx, dy) => { this.cameras.main.zoom = Phaser.Math.Clamp(this.cameras.main.zoom - (dy * 0.001), 1, 3); });
}

function update() {
    if(window.transitioning) return;
    const speed = 250; 
    if (cursors.left.isDown || wasd.A.isDown) { player.setVelocityX(-speed); player.setFlipX(false); } 
    else if (cursors.right.isDown || wasd.D.isDown) { player.setVelocityX(speed); player.setFlipX(true); } 
    else { player.setVelocityX(0); }
    if (cursors.up.isDown || wasd.W.isDown) { player.setVelocityY(-speed); } 
    else if (cursors.down.isDown || wasd.S.isDown) { player.setVelocityY(speed); } 
    else { player.setVelocityY(0); }

    let cZ = null; let minD = 150;
    lZones.forEach(z => { let d = Phaser.Math.Distance.Between(player.x, player.y, z.x, z.y); if (d < minD) { minD = d; cZ = z; } });

    if(cZ) {
        if(activeLM !== cZ) {
            activeLM = cZ; dialogState = 'intro';
            document.getElementById('ui-layer').style.display = 'flex'; document.getElementById('options-box').style.display = 'flex';
            document.getElementById('dialog-text').innerHTML = `<span class="highlight" style="color:#00ffcc">${cZ.lmData.name}</span><br><br>${cZ.lmData.desc}`;
        }
    } else if(!window.nearReturnPortal) {
        activeLM = null; dialogState = 'hidden';
        document.getElementById('ui-layer').style.display = 'none'; document.getElementById('options-box').style.display = 'none';
    }

    if(window.nearReturnPortal) {
        document.getElementById('ui-layer').style.display = 'flex';
        document.getElementById('options-box').style.display = 'none';
        document.getElementById('dialog-text').innerHTML = '<span style="color:#ffd700; font-weight:bold">⛩️ 传送阵</span><br><br>往北返回宫殿宗庙遗址区<br><br><span style="color:#ffd700">▶ 按【空格键】传送</span>';
        if(Phaser.Input.Keyboard.JustDown(spaceKey)) {
            window.transitioning = true; showToast("正在经传送阵北上返回宫殿宗庙区..."); player.setVelocity(0);
            setTimeout(() => window.location.href = 'yinxu.html', 1000);
        }
    }
    window.nearReturnPortal = false;
}
</script>
    <script src="digital_human.js"></script>
</body>
</html>
