<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>古建游览 - 地下甲骨陵墓</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: "KaiTi", "楷体", serif; }
        #game-container { width: 100%; height: 100%; filter: contrast(1.1) brightness(0.8); }
        #top-right-ui { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 100; }
        .sys-btn { background-color: rgba(0, 0, 0, 0.8); border: 2px solid #55aaff; color: #55aaff; padding: 10px 20px; font-size: 20px; font-family: "KaiTi"; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(85,170,255,0.4); }
        .sys-btn:hover { background-color: #55aaff; color: #000; box-shadow: 0 0 20px rgba(85,170,255,0.8); }
        
        #ui-layer { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 800px; display: none; flex-direction: column; gap: 10px; pointer-events: none; z-index: 90; }
        .dialog-box { background-color: rgba(5, 5, 10, 0.95); border: 3px solid #55aaff; color: #fff; padding: 25px; font-size: 24px; border-radius: 8px; text-align: center; line-height: 1.6; text-shadow: 1px 1px 2px #000; }
        .highlight { color: #55aaff; font-weight: bold; }
        
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(10, 10, 15, 0.98); border: 4px solid #55aaff; color: #fff; padding: 40px; border-radius: 12px; display: none; z-index: 200; text-align: center; min-width: 500px; box-shadow: 0 10px 40px rgba(85,170,255,0.3); }
        .modal h2 { margin-top: 0; color: #55aaff; font-size: 32px; border-bottom: 1px solid #55aaff; padding-bottom: 10px; }
        .close-btn { background-color: #55aaff; color: #000; border: none; padding: 10px 30px; font-size: 22px; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: "KaiTi"; }
        .close-btn:hover { background-color: #fff; }
        
        .ambient-light { position:absolute; width:100%; height:100%; top:0; left:0; background: radial-gradient(circle at center, rgba(0,0,0,0) 20%, rgba(0,0,0,0.85) 100%); pointer-events: none; z-index: 50; }
        
        #toast { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 20, 40, 0.9); border: 2px solid #55aaff; color: #fff; padding: 15px 30px; font-size: 24px; border-radius: 8px; display: none; z-index: 300; opacity: 0; transition: opacity 0.5s; text-align: center; box-shadow: 0 0 20px #55aaff; }
    </style>
</head>
<body>

<div id="game-container"></div>
<div class="ambient-light"></div>

<div id="top-right-ui">
    <button class="sys-btn" onclick="returnToSurface()">🌌 重返地表</button>
</div>

<div id="ui-layer">
    <div id="dialog-text" class="dialog-box"></div>
</div>

<!-- 实景画廊 -->
<div id="gallery-modal" class="modal" style="min-width: 800px; max-height: 80vh; overflow-y: auto; z-index: 500;">
    <h2 id="gallery-title" style="color:#55aaff;">🏛️ 妇好墓 实景遗迹</h2>
    <div id="gallery-list" style="display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 20px;"></div>
    <button class="close-btn" onclick="closeGallery()">结束参观</button>
</div>

<div id="truth-modal" class="modal">
    <h2>📜 万骨之源：天机卜辞</h2>
    <div style="margin:20px 0; text-align:left; font-size:22px; line-height:1.8; color:#ddd;">
        <p>在这幽暗的陵墓深处，堆砌着数以万计的龟甲与兽骨。</p>
        <p>你抹去骨片上的千年尘土，看到上面刻满了古老晦涩的文字，那是商朝大祭司对风雨、生育、战争的叩问与期盼。</p>
        <p style="color:#55aaff; font-weight:bold; text-align:center;">“癸卯卜，今日雨... 其自西来雨？其自东来雨？”</p>
        <p>原来，华夏三千年的文明火种与文字血脉，便在这烈火灼烧的裂纹中，悄然生根发芽并传承至今。</p>
    </div>
    <div style="font-size:26px; color:#00ffcc; font-weight:bold; margin:30px 0;">
        🎊 触发极致隐藏成就：【文明溯源者】
    </div>
    <button class="close-btn" onclick="closeTruthModal()">将甲骨封存，回归现世</button>
</div>

<div id="toast"></div>

<script>
let isPaused = false; 

const config = {
    type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, parent: 'game-container',
    physics: { default: 'arcade', arcade: { debug: false } },
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, cursors, wasd, spaceKey;
let artifacts = []; let activeItem = null;

function preload() {
    this.load.image('bg_tomb', 'province/henan/Architecture/location/bg_yinxu.png'); // 如果有特定的背景可替换，这里暂时重用表层或设为纯黑
    this.load.image('oracle_pile', 'province/henan/Architecture/location/bone.png'); // 复用甲骨资源代表一堆甲骨
    
    let playerSkin = localStorage.getItem('playerSkin') || 'player.png';
    if (playerSkin.startsWith('data:image')) {
        let arr = playerSkin.split(','); let mime = arr[0].match(/:(.*?);/)[1];
        let bstr = atob(arr[1]); let n = bstr.length; let u8arr = new Uint8Array(n);
        while (n--) { u8arr[n] = bstr.charCodeAt(n); }
        let blob = new Blob([u8arr], { type: mime });
        this.load.image('player', URL.createObjectURL(blob));
    } else {
        this.load.image('player', playerSkin);
    }
}

function create() {
    let bg = this.add.image(0, 0, 'bg_tomb').setOrigin(0, 0);
    // 强制暗黑色调，制造地下室深影感
    bg.setTint(0x333333);
    
    let scaleX = this.cameras.main.width / bg.width;
    let scaleY = this.cameras.main.height / bg.height;
    let baseScale = Math.max(scaleX, scaleY) * 1.5; 
    bg.setScale(baseScale);

    let worldWidth = bg.width * baseScale; let worldHeight = bg.height * baseScale;
    this.physics.world.setBounds(0, 0, worldWidth, worldHeight);

    player = this.physics.add.sprite(worldWidth * 0.15, worldHeight * 0.7, 'player');
    let dynamicScale = 150 / player.height;
    player.setScale(dynamicScale); player.setCollideWorldBounds(true); player.body.setSize(player.width * 0.6, player.height * 0.6);

    // 发光的隐藏甲骨堆物品
    let pile = this.physics.add.sprite(worldWidth * 0.8, worldHeight * 0.75, 'oracle_pile');
    pile.setScale(1.2); pile.setImmovable(true);
    pile.itemData = { type: 'oracle', intro: '<span class="highlight">【万骨之渊】</span><br>这里堆放着无数承载着商朝国运的龟甲与兽骨...<br><br>▶ 按【空格键】拂去历史的尘土' };
    artifacts.push(pile); this.physics.add.collider(player, pile);

    // 妇好墓实景探索点
    let tombArtifact = this.physics.add.sprite(worldWidth * 0.2, worldHeight * 0.3, 'oracle_pile');
    tombArtifact.setScale(1.5).setTint(0xff5555); tombArtifact.setImmovable(true);
    tombArtifact.itemData = { type: 'fuhao', intro: '<span class="highlight" style="color:#ff5555">【妇好墓核心区】</span><br>跨越三千年的唯一未被盗掘的商代王室墓葬...<br><br>▶ 按【空格键】查看实景影像' };
    artifacts.push(tombArtifact); this.physics.add.collider(player, tombArtifact);

    // 幽灵蓝色火焰粒子特效
    let particles = this.add.particles('oracle_pile'); 
    particles.createEmitter({
        x: worldWidth * 0.8, y: worldHeight * 0.75,
        speed: { min: -10, max: 10 },
        angle: { min: 0, max: 360 },
        scale: { start: 0.2, end: 0 },
        blendMode: 'ADD',
        lifespan: 3000,
        tint: 0x00aaff,
        frequency: 150,
        alpha: { start: 0.5, end: 0 }
    });

    cursors = this.input.keyboard.createCursorKeys();
    wasd = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68 });
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    // ========== 产品爆炸图（Exploded View）效果 ==========
    // 模拟一个由多层结构组成的文物或场景层。点击时各层拉开，展示内部结构。
    let explodedLayers = [];
    let isExploded = false;
    let centerX = worldWidth * 0.5;
    let centerY = worldHeight * 0.5;

    // 创建5个模拟切片组件（当您有真实的拆解图时，可替换为你自己的不同图片）
    for (let i = 0; i < 5; i++) {
        let layer = this.add.image(centerX, centerY, 'oracle_pile').setInteractive();
        layer.setScale(1.2 - (i * 0.1)); // 制造一定层级错觉
        layer.setTint(0xffffff - (i * 0x222222)); // 用明暗区分层级
        layer.baseY = centerY;
        layer.baseX = centerX;
        // 爆炸展开后的坐标：沿Y轴和X轴斜向拉开（类似您提供的产品分解图倾斜轴线）
        layer.targetY = centerY - (i * 120) + 240; 
        layer.targetX = centerX + (i * 40) - 80; 
        layer.setDepth(i);
        explodedLayers.push(layer);
    }

    let explodeHint = this.add.text(centerX, centerY + 120, '【点击中央器物查看结构爆炸图】', { font: '24px KaiTi', fill: '#00ffcc', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);

    // 点击触发爆炸图组件拉长展开 / 收起
    explodedLayers.forEach(layer => {
        layer.on('pointerdown', () => {
            isExploded = !isExploded;
            explodeHint.setText(isExploded ? '【再次点击收合器件】' : '【点击中央器物查看结构爆炸图】');
            
            explodedLayers.forEach((l, index) => {
                this.tweens.add({
                    targets: l,
                    x: isExploded ? l.targetX : l.baseX,
                    y: isExploded ? l.targetY : l.baseY,
                    alpha: isExploded ? 0.9 : 1, // 展开时微微半透明更显科技感与结构透视
                    duration: 1200,
                    ease: 'Back.easeOut' // 使用稍微带点弹性的缓冲动画拉开
                });
            });
        });
    });
    // =====================================================

    this.cameras.main.startFollow(player, true, 0.08, 0.08); 
}

function update() {
    if (isPaused) { player.setVelocity(0); return; }
    const speed = 200; 
    if (cursors.left.isDown || wasd.A.isDown) { player.setVelocityX(-speed); player.setFlipX(false); } 
    else if (cursors.right.isDown || wasd.D.isDown) { player.setVelocityX(speed); player.setFlipX(true); } 
    else { player.setVelocityX(0); }
    if (cursors.up.isDown || wasd.W.isDown) { player.setVelocityY(-speed); } 
    else if (cursors.down.isDown || wasd.S.isDown) { player.setVelocityY(speed); } 
    else { player.setVelocityY(0); }

    let closestItem = null; let minDistance = 200; 
    artifacts.forEach(item => {
        let distance = Phaser.Math.Distance.Between(player.x, player.y, item.x, item.y);
        if (distance < minDistance) { minDistance = distance; closestItem = item; }
    });

    const uiLayer = document.getElementById('ui-layer');
    const dialogText = document.getElementById('dialog-text');

    if (closestItem) {
        if (activeItem !== closestItem) {
            activeItem = closestItem; 
            uiLayer.style.display = 'flex'; 
            dialogText.innerHTML = activeItem.itemData.intro;
        }
        if (Phaser.Input.Keyboard.JustDown(spaceKey)) {
            if (activeItem.itemData.type === 'fuhao') {
                openGallery("妇好墓实景", [
                    "../yinxu_photo/fuhao/fuhaomu1.png",
                    "../yinxu_photo/fuhao/fuhaomu2.png",
                    "../yinxu_photo/fuhao/fuhaomu3.png"
                ]);
            } else {
                openTruthModal();
            }
        }
    } else {
        activeItem = null; uiLayer.style.display = 'none';
    }
}

// ========== 实景画廊展示 ==========
window.openGallery = function(title, images) {
    document.getElementById('ui-layer').style.display = 'none';
    let gModal = document.getElementById('gallery-modal');
    document.getElementById('gallery-title').innerText = title;
    
    let listHtml = images.map(img => `<img src="${img}" style="width:100%; border:3px solid #55aaff; border-radius:10px; margin-bottom:15px;">`).join('');
    document.getElementById('gallery-list').innerHTML = listHtml;
    
    gModal.style.display = 'flex';
    gModal.style.flexDirection = 'column';
    isPaused = true;
}
window.closeGallery = function() {
    document.getElementById('gallery-modal').style.display = 'none';
    isPaused = false;
}

function openTruthModal() {
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('truth-modal').style.display = 'block';
    isPaused = true;
}

window.closeTruthModal = function() {
    document.getElementById('truth-modal').style.display = 'none';
    isPaused = false;
    showToast("时光回溯完毕，你已将这份璀璨厚重的殷商历史记在心中。");
}

function showToast(msg) {
    const toast = document.getElementById('toast'); toast.innerHTML = msg; toast.style.display = 'block'; toast.style.opacity = 1;
    setTimeout(() => { toast.style.opacity = 0; setTimeout(() => toast.style.display = 'none', 500); }, 3500);
}

window.returnToSurface = function() {
    showToast("离开甲骨地宫，正在重返地表...");
    setTimeout(() => { window.location.href = 'yinxu.html'; }, 1000);
}
</script>
    <script src="digital_human.js"></script>
</body>
</html>
